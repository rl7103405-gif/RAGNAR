{% extends "base.html" %}
{% block titulo %}Produccion - Deportivos Quini{% endblock %}
{% block nombre_estacion %}Produccion{% endblock %}
{% block contenido %}
<div class="tarjeta">
    <div id="mensaje" class="mensaje" style="display:none;"></div>

    <label for="campo-folio">Escanear folio</label>
    <input type="text" id="campo-folio" autofocus autocomplete="off" placeholder="Escanea el codigo de barras del folio">

    <div class="peso-grande" id="peso-actual">--- g</div>

    <button class="boton boton-grande" id="btn-capturar-peso">Capturar peso</button>
    <br><br>
    <button class="boton boton-verde" id="btn-guardar" disabled>Guardar</button>
</div>

<div class="tarjeta">
    <h3>Ultimos folios pesados en esta estacion</h3>
    <table id="tabla-recientes">
        <thead><tr><th>Folio</th><th>Peso (g)</th><th>Hora</th></tr></thead>
        <tbody></tbody>
    </table>
</div>
{% endblock %}

{% block script %}
<script>
let pesoCapturado = null;
const recientes = [];

const campoFolio = document.getElementById("campo-folio");
const pesoActual = document.getElementById("peso-actual");
const btnGuardar = document.getElementById("btn-guardar");

document.getElementById("btn-capturar-peso").addEventListener("click", async () => {
    try {
        const lectura = await leerPesoBascula();
        if (lectura.error) {
            mostrarMensaje("mensaje", "Bascula: " + lectura.error, "error");
            return;
        }
        pesoCapturado = lectura.peso;
        pesoActual.textContent = pesoCapturado.toFixed(1) + " g";
        btnGuardar.disabled = !campoFolio.value.trim();
        ocultarMensaje("mensaje");
    } catch (e) {
        mostrarMensaje("mensaje", "No se pudo conectar con la bascula (bascula_bridge.py). " + e.message, "error");
    }
});

campoFolio.addEventListener("input", () => {
    btnGuardar.disabled = !(campoFolio.value.trim() && pesoCapturado);
});

btnGuardar.addEventListener("click", async () => {
    const folio = campoFolio.value.trim();
    if (!folio || !pesoCapturado) return;
    try {
        const resultado = await llamarApi("/api/produccion/guardar", {
            method: "POST",
            body: JSON.stringify({ folio: folio, peso: pesoCapturado }),
        });
        mostrarMensaje("mensaje", `Folio ${resultado.folio} guardado con peso ${resultado.peso_produccion.toFixed(1)} g`, "exito");
        recientes.unshift(resultado);
        actualizarTabla();
        campoFolio.value = "";
        pesoCapturado = null;
        pesoActual.textContent = "--- g";
        btnGuardar.disabled = true;
        campoFolio.focus();
    } catch (e) {
        mostrarMensaje("mensaje", e.message, "error");
    }
});

function actualizarTabla() {
    const tbody = document.querySelector("#tabla-recientes tbody");
    tbody.innerHTML = "";
    recientes.slice(0, 15).forEach((r) => {
        const tr = document.createElement("tr");
        const hora = new Date(r.timestamp).toLocaleTimeString();
        tr.innerHTML = `<td>${r.folio}</td><td>${r.peso_produccion.toFixed(1)}</td><td>${hora}</td>`;
        tbody.appendChild(tr);
    });
}
</script>
{% endblock %}
