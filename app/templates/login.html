{% extends "base.html" %}
{% block titulo %}Iniciar sesion - Deportivos Quini{% endblock %}
{% block contenido %}
<div class="tarjeta login-caja">
    <h2 style="text-align:center;">Deportivos Quini</h2>
    <p style="text-align:center; color:#566573;">Sistema de Trazabilidad</p>
    {% if error %}
    <div class="mensaje error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login">
        <label for="nombre_usuario">Usuario</label>
        <input type="text" id="nombre_usuario" name="nombre_usuario" autofocus required>
        <label for="password">Contrasena</label>
        <input type="password" id="password" name="password" required>
        <button class="boton" type="submit">Entrar</button>
    </form>
</div>
{% endblock %}
